name: mobile
description: "CU09 y CU10 — Aplicación móvil de la herramienta CASE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --------------------------------------------------------------- CU09
  # Una sola aplicación para cualquier backend generado: se conecta a su URL,
  # lee /api/_meta y arma con eso sus listas y sus formularios.
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  # Escanear el código QR que enseña el editor al publicar: es como se conecta
  # el teléfono sin teclear una dirección larga.
  mobile_scanner: ^5.2.3
  # Recordar a qué backend se conectó la última vez.
  shared_preferences: ^2.3.3

  # --------------------------------------------------------------- CU10
  # La base local: lo último sincronizado y la cola de lo que falta por subir.
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  # Saber si hay red, para el indicador y para disparar la sincronización.
  connectivity_plus: ^6.1.0

  # ------------------------------------------------------- voz e IA local
  # Reconocimiento de voz del propio dispositivo. Se le pide expresamente que
  # trabaje sin conexión: es lo que permite dictar en modo avión.
  speech_to_text: ^7.0.0
  # Modelo de lenguaje pequeño corriendo en el teléfono. El modelo NO va dentro
  # del APK: se descarga la primera vez que se usa el asistente.
  flutter_gemma: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drift escribe el código de acceso a la base local a partir de las tablas.
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
