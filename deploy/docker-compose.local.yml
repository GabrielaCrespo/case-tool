# La herramienta CASE en un portátil, sin AWS.
#
#     docker compose -f deploy/docker-compose.local.yml up -d
#
# No levanta la herramienta: el backend y el editor se arrancan aparte con
# `npm run start:dev` y `npm run dev`, como siempre en desarrollo. Esto es lo
# que en la instancia ponía deploy/docker-compose.yml alrededor de ellos:
#
#   - PostgreSQL 16, que aquí hace los tres papeles que allí estaban
#     repartidos: la base de la herramienta (`case_tool`, que era Supabase), las
#     de los backends que publica CU08 —una por despliegue, creadas con
#     `docker exec`— y la del arranque de humo de CU07 (`postgres`).
#   - Traefik, que reparte /d/<slug> entre los backends publicados igual que en
#     la instancia, pero por HTTP: sin dominio no hay certificado. El teléfono
#     llega por la Wi-Fi a http://<IP del portátil>/d/<slug>.
#
# El contenedor de PostgreSQL, su alias y la red se llaman igual que en
# deploy/docker-compose.yml a propósito: así DEPLOY_DB_CONTAINER, DEPLOY_DB_HOST
# y DEPLOY_NETWORK sirven con sus valores por defecto también aquí. Por lo
# mismo, los dos archivos no pueden estar levantados a la vez en una máquina.
#
# El esquema (database/db.sql) se aplica sólo cuando la base está vacía. Para
# empezar de cero:
#
#     docker compose -f deploy/docker-compose.local.yml down -v

name: case-tool-local

networks:
  case-tool:
    name: case-tool

volumes:
  postgres-data:

services:
  traefik:
    image: traefik:v3.3
    container_name: case-tool-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=case-tool
      # Sólo HTTP. Los backends se publican con DEPLOY_TLS=false, que es lo que
      # les pone este punto de entrada en vez de websecure.
      - --entrypoints.web.address=:80
    ports:
      # En todas las interfaces: el teléfono tiene que llegar desde la Wi-Fi.
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - case-tool

  postgres:
    image: postgres:16
    container_name: case-tool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: case_tool
    ports:
      # El 5432 suele estar ocupado por otro PostgreSQL de la máquina. Sólo en
      # 127.0.0.1: desde la Wi-Fi no se ve.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Se ejecuta una sola vez, al inicializar la base, contra POSTGRES_DB.
      - ../database/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
    networks:
      - case-tool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_tool"]
      interval: 5s
      timeout: 5s
      retries: 20
