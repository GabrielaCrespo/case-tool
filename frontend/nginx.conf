# El editor es una sola página con rutas de React Router: /proyectos,
# /diagramas/<id>… Ninguna de esas rutas es un archivo en disco, así que
# cualquier petición que no encuentre archivo devuelve index.html y es React
# quien decide qué pintar. Sin esta regla, recargar el navegador dentro del
# editor daría un 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con huella en el nombre (app-8f3a1c.js) no cambian nunca:
    # se pueden guardar para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
